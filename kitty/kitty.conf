# Shared Kitty preferences. Edit this file, then run `just switch` to apply.
# Restart Kitty after a font change so it reloads the installed font.

font_family Hack Nerd Font Mono
font_size 15.0

# Start new windows on an exact 120 × 35 character grid. Kitty/Wayland cannot
# snap manual resizing to cells, so place any remainder at the bottom-right.
remember_window_size no
initial_window_width 120c
initial_window_height 35c
placement_strategy top-left

background_opacity 0.95
enable_audio_bell no
confirm_os_window_close 0
shell zsh

map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map shift+insert paste_from_selection
